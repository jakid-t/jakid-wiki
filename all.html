<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все статьи — Википедия о микронациях</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="wiki-header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <span class="logo-globe">🌐</span>
            <span class="logo-text">Википедия<br><small>Микронации</small></span>
        </a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск микронации..." autocomplete="off">
            <div id="searchResults" class="search-results"></div>
        </div>
        <div class="header-links">
            <a href="index.html">Главная</a>
            <a href="all.html">Все статьи</a>
        </div>
    </div>
</header>

<main id="content">
    <h1 class="firstHeading">Все статьи</h1>
    <ul class="article-list" id="allList"></ul>
</main>

<footer id="wiki-footer">
    <p>Материал из «Википедии о микронациях» — свободной энциклопедии.</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
    document.getElementById("allList").innerHTML = MICRONATIONS.map(mn => `
        <li>
            <span class="list-flag">
                ${mn.flag
                    ? `<img src="${mn.flag}" style="width:100%;height:100%;object-fit:cover;"
                            onerror="this.outerHTML='${mn.flagEmoji || "🏴"}'">`
                    : (mn.flagEmoji || "🏴")}
            </span>
            <a href="${mn.id}.html">${mn.title}</a>
            <span style="color:#54595d;font-size:0.9em;">— ${mn.shortDesc}</span>
        </li>
    `).join("");
</script>
</body>
</html>
