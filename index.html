<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Википедия — Микронации</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="wiki-header">
    <div class="header-inner">
        <a href="index.html" class="logo">
            <span class="logo-globe">🌐</span>
            <span class="logo-text">Википедия<br><small>Микронации</small></span>
        </a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск микронации..." autocomplete="off">
            <div id="searchResults" class="search-results"></div>
        </div>
        <div class="header-links">
            <a href="index.html">Главная</a>
            <a href="all.html">Все статьи</a>
        </div>
    </div>
</header>

<main id="content">
    <div class="main-page">
        <h1 class="firstHeading">Добро пожаловать в Википедию о микронациях</h1>
        <p>Здесь собраны статьи о самых известных <b>микронациях</b> мира.</p>
        <h2>Все статьи</h2>
        <div class="article-grid" id="homeGrid"></div>
    </div>
</main>

<footer id="wiki-footer">
    <p>Материал из «Википедии о микронациях» — свободной энциклопедии.</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
    // Рендер карточек на главной
    document.getElementById("homeGrid").innerHTML = MICRONATIONS.map(mn => `
        <a class="article-card" href="${mn.id}.html">
            <div class="card-flag">
                ${mn.flag
                    ? `<img src="${mn.flag}" alt="" onerror="this.outerHTML='<span style=\\'font-size:2.5em;\\'>${mn.flagEmoji || "🏴"}</span>'">`
                    : `<span style="font-size:2.5em;">${mn.flagEmoji || "🏴"}</span>`}
            </div>
            <div class="card-title">${mn.title}</div>
            <div class="card-desc">${mn.shortDesc}</div>
        </a>
    `).join("");
</script>
</body>
</html>
